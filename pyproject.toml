[project]
name = "waypoint"
version = "2.0.0"
description = "Chat-first copilot that guides an SME owner from 'a shop in Singapore' to a funded, dated plan, and keeps them on it."
requires-python = ">=3.11,<3.12"
license = "Apache-2.0"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-ai-slim[anthropic,openai,ag-ui]>=1.0",
  "ag-ui-protocol>=0.1",
  "numpy>=2.0",
  "pyyaml>=6.0",
  "sqlalchemy>=2.0",
  "apscheduler>=3.10,<4",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
  "pillow>=10.0",
  "rfc8785>=0.1.4",
  "claude-agent-sdk>=0.2",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "hypothesis>=6.100",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-PyYAML",
  "playwright>=1.64.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: long-running tests excluded from make test"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["web", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.File", "fastapi.Query"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["tools", "rules"]
plugins = ["pydantic.mypy"]
