# Funding catalogue (SPEC §6.4). Amounts are computed by tools/funding.py, never written here.
# status: open | optional | closed. Closed routes cite the rule (rules/rules.yaml) that closes them.
# card: where a route is shown. Only `plan` routes count toward the Singapore plan and its funding mix; `webank`
# and `partner_bank` cards are what the banks do *around* the plan (home working capital, custody, FX), shown on
# the funding screen and never counted. `never_in_plan` names the rule a plan breaks if it counts the route.
# Bank cards are dated (`as_of`) and, where a bank decides, `subject_to_approval`. status `later` with
# card `after_opening` is a read-only view of what may come after opening, never counted (R8).
# Ranking (tools/funding.py rank_options, judge memo §1b): `cost_kind` (own_cash and terms cost 0; profit_share
# counts the partner's share of the Singapore profit; timing routes change when money is paid and aren't ranked),
# `speed_weeks` (weeks from the plan start: a number, a timeline milestone id, or `setaside`), `dilution`, and
# `eligible_when_*`, the reason shown while the route isn't open to this owner. No number is ranked from here:
# code computes each measure from the owner's data and the plan model.

as_of: 2026-10-20
webank_role:
  en: "WeBank's role: working capital for your shops at home; optionally, your savings pot as a deposit or account in your company's own name; and a shock buffer that the plan never draws. It does not lend to the Singapore shop."
  zh: "微众银行的角色：为国内门店提供流动资金；可选地把您的储蓄放在公司名下的存款或账户中；以及一个计划中永不动用的应急缓冲。它不为新加坡门店放贷。"

# "Compare funding plans" (tools/compare.py, SPEC §6.4): each column is a set of plan routes, run once through the
# plan model at the slider's set-aside share with everything else in the owner's plan unchanged. `toggles` are the
# toggle_option actions "Choose this funding" sends. No number is written here: code computes every figure, and the
# pros and cons are the ranking words (tools/funding.py) plus each route's own cost and conditions above.
compare:
  - id: setaside
    routes: [spare_cash, setaside]
    toggles: {own_savings: false, partner_equity: false}
    title_en: "Set-aside only"
    title_zh: "只用利润留存"
    blurb_en: "Your spare cash and the monthly set-aside from profit; nothing else."
    blurb_zh: "只用闲置资金和每月利润留存。"
  - id: savings
    routes: [spare_cash, setaside, own_savings]
    toggles: {own_savings: true, partner_equity: false}
    title_en: "Set-aside + your savings"
    title_zh: "利润留存 + 个人储蓄"
    blurb_en: "Adds savings you put in as capital through your Shenzhen company. Change the amount to see it move."
    blurb_zh: "加上您通过深圳公司作为出资投入的储蓄。改动金额即可看到变化。"
  - id: partner
    routes: [spare_cash, setaside, partner_equity]
    toggles: {own_savings: false, partner_equity: true}
    title_en: "Set-aside + a local partner"
    title_zh: "利润留存 + 本地合伙人"
    blurb_en: "A Singapore citizen or PR partner takes a share of the company and pays that share of the cost."
    blurb_zh: "新加坡公民或永久居民合伙人持有公司部分股份，并承担相应比例的费用。"

options:
  - id: spare_cash
