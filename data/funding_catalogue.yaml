    available_from_zh: "取得贷款行同意并在银行登记后"
    cost_en: "None"
    cost_zh: "无"
    conditions_en: "At most 15% of the planned total; never the lease deposit; 6-month clock (R4)"
    conditions_zh: "不超过计划总额的15%；不得用于租赁押金；6个月期限（R4）"
    cost_kind: timing

  - id: partner_equity
    status: optional
    rule_ids: [R8]
    label_en: "Local partner equity (at least 30% Singapore citizen/PR)"
    label_zh: "本地合伙人入股（新加坡公民/永久居民至少30%）"
    covers_en: "The partner's share of the cost"
    covers_zh: "合伙人份额对应的费用"
    available_from_en: "When a partner signs"
    available_from_zh: "合伙人签约后"
    cost_en: "A share of the profit"
    cost_zh: "分出部分利润"
