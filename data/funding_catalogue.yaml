    label_en: "Spare cash (home company)"
    label_zh: "闲置资金（国内公司）"
    covers_en: "Any cost, once the legal steps allow transfers"
    covers_zh: "法定步骤完成后可用于任何费用"
    available_from_en: "Now (held in the pot until the first transfer)"
    available_from_zh: "现在（首笔汇款前存放在储蓄账户）"
    cost_en: "None"
    cost_zh: "无"
    conditions_en: "Only cash above the safety floor and the payroll buffer"
    conditions_zh: "仅限安全底线和工资缓冲之上的现金"
    cost_kind: own_cash
    speed_weeks: 0
    dilution: none
    eligible_when_en: "Only when you have cash above the safety floor and the payroll buffer"
    eligible_when_zh: "仅在现金高于安全底线和工资缓冲时"

  - id: setaside
    status: open
    rule_ids: [R2, R5]
    label_en: "Set-aside from monthly profit"
    label_zh: "每月利润留存"
    covers_en: "Any cost, in the legal order"
    covers_zh: "按法定顺序用于任何费用"
    available_from_en: "Monthly, from now"
    available_from_zh: "从现在起每月"
    cost_en: "Profit not drawn or reinvested at home"
    cost_zh: "放弃在国内分配或再投资的利润"
    conditions_en: "Paused while WeBank borrowing is above your normal level (R2); only from cash above the floor"
    conditions_zh: "微众贷款高于您的正常水平时暂停（R2）；只用底线之上的现金"
    cost_kind: own_cash
    speed_weeks: setaside
    dilution: none
    eligible_when_en: "Only when the shops make a profit to set aside from"
    eligible_when_zh: "仅在门店有利润可留存时"

  - id: own_savings
    status: optional
    rule_ids: [R7, R4]
    label_en: "Your own savings, put in as capital"
    label_zh: "个人储蓄作为出资"
    covers_en: "Any cost"
    covers_zh: "任何费用"
    available_from_en: "When you choose"
    available_from_zh: "随时"
    cost_en: "Your personal savings"
    cost_zh: "您的个人储蓄"
    conditions_en: "Savings only, never borrowed money (R7). Put in through your Shenzhen company: it becomes the company's capital and goes to Singapore under the company's ODI filing and bank registration, never sent personally or on your own FX quota (R4). Source of funds is checked in the filing"
    conditions_zh: "只能是储蓄，不能是借款（R7）。通过深圳公司投入：先作为公司出资，再由公司凭境外投资备案和银行登记汇往新加坡，不能以个人名义或用个人购汇额度汇出（R4）。备案时会核查资金来源"
    cost_kind: own_cash
    speed_weeks: 0
    dilution: none
    eligible_when_en: "Only if you have savings to put in: tap “Add my savings”"
    eligible_when_zh: "仅在您有储蓄可投入时：点“加入个人积蓄”"
    source: "NDRC Order 11 (企业境外投资管理办法, 2017) and MOFCOM 境外投资管理办法 (2014): outbound investment is made by the enterprise; SAFE 资本项目外汇业务指引 (2024): ODI registration at the bank; 个人外汇管理办法实施细则 (汇发〔2007〕1号) Art. 2: the USD 50,000 annual quota covers current items, and capital items go under its capital-account chapter (Art. 16: a person's own outbound investment needs SAFE approval and registration); SAFE's 个人购汇申请书 (2017): FX bought on the quota can't be used for capital-account items not yet open, such as investing abroad"
    source_kind: law
    source_url: "https://www.safe.gov.cn/neimenggu/file/file/20170728/b94fb1d6db30472584863040ecb838f3.pdf"

  - id: landlord_terms
    status: optional
    rule_ids: [R6]
    label_en: "Landlord terms: rent-free fit-out months; deposit within the code's default"
    label_zh: "房东条件：装修免租期；押金不超过守则默认"
    covers_en: "Reduces pre-opening rent; keeps the deposit at the default"
    covers_zh: "减少开业前租金；押金保持默认"
    available_from_en: "In the letter of offer"
    available_from_zh: "写入要约函时"
    cost_en: "None, if agreed"
    cost_zh: "如获同意则无"
    conditions_en: "Counted only once it is in the signed offer"
    conditions_zh: "只有写入已签要约后才计入"
