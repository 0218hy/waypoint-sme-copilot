    covers_zh: "不能用于新加坡"
    available_from_en: "Never for this purpose"
    available_from_zh: "不可用于此用途"
    cost_en: "Breach of the loan's purpose"
    cost_zh: "违反贷款用途"
    conditions_en: "Loan money can't fund the overseas shop, the pot or the Singapore company"
    conditions_zh: "贷款资金不得用于境外门店、储蓄账户或新加坡公司"

