    label_zh: "开业前的新加坡银行 / EFS 贷款"
    covers_en: "Not available before opening"
    covers_zh: "开业前不可用"
    available_from_en: "After opening: see the after-opening card"
    available_from_zh: "开业后：见“开业后”卡片"
    cost_en: "Interest"
    cost_zh: "利息"
    conditions_en: "Banks usually want trading history first (market practice); EFS needs at least 30% local shareholding. Never counted before opening (R8)"
    conditions_zh: "银行通常要求先有经营记录（市场惯例）；EFS需要至少30%本地持股。开业前不计入（R8）"

