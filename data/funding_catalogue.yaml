    cost_zh: "违反贷款用途；无法通过境外投资资金来源审查"
    conditions_en: "Owner capital comes from savings only"
    conditions_zh: "出资只能来自储蓄"

  # ---------------------------------------------------------------- around the plan: what the banks say yes to

  - id: webank_home_wc
    status: optional
    card: webank
    never_in_plan: R1
    note_rule: R2
    as_of: 2026-10-20
    subject_to_approval: true
    rule_ids: [R1, R2]
    label_en: "WeBank 微业贷 for your home shops"
    label_zh: "微业贷：用于国内门店"
    covers_en: "Documented needs of your shops at home: stock, seasonal wages, a Shenzhen refit. Nothing in Singapore"
    covers_zh: "国内门店有据可查的经营需要：备货、季节性工资、深圳门店翻新。不用于新加坡"
    available_from_en: "Online, when WeBank approves it"
    available_from_zh: "线上申请，经微众银行审批后"
    cost_en: "Interest at the rate WeBank offers you"
    cost_zh: "按微众银行给您的利率计息"
    conditions_en: "Sized to the real need net of your own funds, and only up to your usual borrowing level: the amount shown is what's left below it this month. Loan money never goes to Singapore or the pot (R1)"
    conditions_zh: "按扣除自有资金后的实际需要确定额度，且不超过您平时的借款水平：显示的金额是本月距平时水平的余量。贷款资金不得用于新加坡或储蓄账户（R1）"
    source: "流动资金贷款管理办法 (2024) Art. 6 and the annex formula (a loan no larger than the real need net of own funds), Art. 9; 互联网贷款管理暂行办法 Art. 24(三); WeBank's 微业贷 terms: business use only, never dividends, property, financial assets or equity investment"
    source_kind: law
    source_url: "https://www.gov.cn/gongbao/2024/issue_11306/202404/content_6947721.html"
    product_en: "WeBank 微业贷 product page"
    product_zh: "微众银行微业贷产品页"
    product_url: "https://sme.webank.com/esp-web/rls/asset/wyd/index.html"

  - id: webank_pot_deposit
    status: optional
    card: webank
    as_of: 2026-10-20
    subject_to_approval: true
    rule_ids: [R3, R5]
    label_en: "Your savings pot as a WeBank deposit in your company's name"
    label_zh: "储蓄存为公司名下的微众存款"
    covers_en: "Holds the spare cash and set-aside until the legal steps allow the first transfer"
    covers_zh: "在法定步骤允许首笔汇款之前，存放闲置资金和每月留存"
    available_from_en: "Now, if you choose"
    available_from_zh: "现在，如您选择"
    cost_en: "None; it earns deposit interest"
    cost_zh: "无；按存款计息"
    conditions_en: "A deposit or account in your company's own name, never pledged: a pledge for Singapore credit would be a guarantee from home (R3). Its statements show the money came from profit"
    conditions_zh: "公司名下的存款或账户，永不质押：为新加坡借款质押即构成内保外贷（R3）。其流水可证明资金来自利润"

  - id: partner_bank_fx
    status: optional
    card: partner_bank
    as_of: 2026-10-20
    subject_to_approval: true
    rule_ids: [R4, R7]
    label_en: "FX and transfer at the bank that registers your ODI"
    label_zh: "由办理境外投资登记的银行换汇汇款"
    covers_en: "Converting to Singapore dollars and sending to your Singapore company"
    covers_zh: "兑换新加坡元并汇往您的新加坡公司"
    available_from_en: "After lender consent, the ODI filing and the bank registration (R4)"
    available_from_zh: "取得贷款行同意、完成境外投资备案和银行登记之后（R4）"
    cost_en: "That bank's FX spread and fees"
    cost_zh: "该银行的汇差和手续费"
    conditions_en: "Your WeBank statements go to that bank as proof the money is the company's profit and your savings, never borrowed (R7). WeBank itself doesn't do the corporate FX or the ODI registration"
    conditions_zh: "把微众银行流水交给该银行，证明资金来自公司利润和个人储蓄，而非借款（R7）。微众银行本身不办理企业换汇或境外投资登记"
    source: "SAFE 资本项目外汇业务指引 (2024) §8.1 (ODI registration at a bank) and §8.2.2.1(4) (source-of-funds proof)"
    source_kind: law
    source_url: "https://www.safe.gov.cn/safe/file/file/20240412/14f97540545646e48df3a821639651eb.pdf"

  # ---------------------------------------------------------------- after opening: a view, never in the plan

  - id: efs_after_opening
    status: later
    card: after_opening
    never_in_plan: R8
    as_of: 2026-10-20
    subject_to_approval: true
    rule_ids: [R8]
    label_en: "Singapore loans after opening: EFS working capital, bank SME loans"
    label_zh: "开业后的新加坡贷款：EFS流动资金贷款、银行中小企业贷款"
    covers_en: "Working capital for the Singapore shop once it trades"
    covers_zh: "门店开业经营后的流动资金"
    available_from_en: "After opening. EFS: once a local partner holds at least 30%. Banks: usually after 6 to 12 months of trading (market practice)"
    available_from_zh: "开业之后。EFS：本地合伙人持股至少30%后。银行：通常需经营6至12个月（市场惯例）"
    cost_en: "Interest; EFS loans are partly risk-shared by Enterprise Singapore"
    cost_zh: "利息；EFS贷款由新加坡企业发展局分担部分风险"
    conditions_en: "Never counted in this plan (R8). EFS needs at least 30% local shareholding (Singapore citizens or PRs, by ultimate ownership) and sets no trading-history test"
