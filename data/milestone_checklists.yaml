# Milestone checklists (SPEC §7.4): what to prepare for a step, shown from the timeline.
#
# Waypoint drafts; the owner (or the filing agent / corporate service provider he hires) does the step.
# Every item names its source. Items carry no amounts or counts: quantities in the product come from
# Figures only. The exact document list is set by the authority and confirmed by the agent; these
# lists are a starting point, dated, and labelled as such in the card.
#
# Fields per item: id, en, zh, who (owner | agent | provider | bank), source (a key of `sources`).

as_of: 2026-10-19

sources:
  ndrc_11:
    label: "State Council Decree 837 Art. 27; NDRC Order 11 (企业境外投资管理办法): project filing"
    url: "https://www.gov.cn/gongbao/2026/issue_12786/202606/content_7071618.html"
    as_of: "2026-10"
  mofcom_3:
    label: "MOFCOM Order 2014 No. 3 (境外投资管理办法): enterprise filing and the outbound investment certificate"
    url: null
    as_of: "2026-10"
  safe_2024:
    label: "SAFE capital account guide (2024) §8.1: 前期费用 and ODI registration"
    url: "https://www.gov.cn/zhengce/zhengceku/202404/P020240413283163235756.pdf"
    as_of: "2026-10"
  loan_2024:
    label: "流动资金贷款管理办法 (2024) Art. 25(3): the lender's consent"
    url: "https://www.gov.cn/gongbao/2024/issue_11306/202404/content_6947721.html"
    as_of: "2026-10"
  acra:
    label: "ACRA: setting up a local company"
    url: "https://www.acra.gov.sg/how-to-guides/setting-up-a-local-company"
    as_of: "2026-10"
  companies_act:
    label: "Singapore Companies Act 1967 (resident director, secretary, registered office, controllers)"
    url: "https://sso.agc.gov.sg/Act/CoA1967"
    as_of: "2026-10"
  waypoint_rules:
    label: "Waypoint plan rules R1, R3, R7 (rules/rules.yaml)"
    url: null
    as_of: "2026-10"

checklists:
  odi_filing:
    title: {en: "ODI filing: what to prepare", zh: "境外投资备案：需要准备的材料"}
    who: {en: "Your filing agent files; you sign the forms", zh: "由备案代理提交；表格由你签署"}
    items:
      - id: consent_letter
        en: "WeBank's written consent as your lender (the reply to your consent request)"
        zh: "微众银行作为贷款人的书面同意（对你同意申请的回复）"
        who: owner
        source: loan_2024
      - id: ndrc_form
        en: "The NDRC project filing form for the Singapore shop, filed with the Shenzhen DRC"
        zh: "新加坡门店的发改委项目备案表，向深圳市发改委提交"
        who: agent
        source: ndrc_11
      - id: mofcom_form
        en: "The Commerce Bureau outbound investment filing form, filed online, for the investment certificate"
        zh: "商务局境外投资备案表（网上提交），用于领取《企业境外投资证书》"
        who: agent
        source: mofcom_3
      - id: licence
        en: "Your Shenzhen company's business licence"
        zh: "深圳公司的营业执照"
        who: owner
        source: ndrc_11
      - id: resolution
        en: "A shareholders' or board decision approving the Singapore investment"
        zh: "批准本次新加坡投资的股东会或董事会决议"
        who: owner
        source: ndrc_11
      - id: source_of_funds
        en: "Proof the money comes from the company's own profit and savings: recent financial statements and the set-aside account statements"
        zh: "资金来源证明：资金来自公司自有利润和积蓄，附近期财务报表和储蓄子账户流水"
        who: owner
        source: waypoint_rules
      - id: no_guarantee
        en: "A note that nothing in China guarantees the Singapore company's obligations"
        zh: "说明境内不为新加坡公司的任何义务提供担保"
        who: owner
        source: waypoint_rules
      - id: pre_investment
        en: "If you need money before the company exists: the pre-investment allowance (前期费用) request, never for the lease deposit"
        zh: "如在公司成立前需要用款：前期费用申请（不能用于租赁押金）"
        who: agent
        source: safe_2024

  incorporate:
    title: {en: "Incorporating the Pte Ltd: what to prepare", zh: "注册新加坡公司：需要准备的材料"}
    who: {en: "Your corporate service provider registers it; the Singapore bank opens the account", zh: "由公司秘书服务商注册；由新加坡银行开户"}
    items:
      - id: name
        en: "A company name to reserve with ACRA, with a second choice"
        zh: "向 ACRA 申请保留的公司名称，并准备备选名称"
        who: provider
        source: acra
      - id: resident_director
        en: "A director who lives in Singapore (a nominee from the provider, or a local partner)"
        zh: "一位常住新加坡的董事（服务商提供的挂名董事，或本地合伙人）"
        who: provider
        source: companies_act
      - id: secretary
        en: "A company secretary (usually the provider)"
        zh: "公司秘书（通常由服务商担任）"
        who: provider
        source: companies_act
      - id: office
        en: "A registered office address in Singapore (the provider's address is common)"
        zh: "新加坡注册办公地址（常用服务商地址）"
        who: provider
        source: companies_act
      - id: shareholder_docs
        en: "Your Shenzhen company's documents as the shareholder: business licence, articles, and the board decision naming its representative"
        zh: "深圳公司作为股东的文件：营业执照、公司章程，以及指定代表人的董事会决议"
        who: owner
        source: acra
      - id: ids
        en: "Passports and addresses of every director and of the people who ultimately control the company"
        zh: "每位董事及公司最终控制人的护照和地址"
        who: owner
        source: companies_act
      - id: odi_record
        en: "The ODI filing certificate and the bank's ODI registration record, ready for the first transfer"
        zh: "境外投资备案证书和银行 ODI 外汇登记凭证，为首笔汇款备好"
        who: owner
        source: safe_2024
      - id: bank_account
        en: "The Singapore bank's account-opening forms, the company's ACRA business profile and a board decision to open the account"
        zh: "新加坡银行开户表格、公司的 ACRA 商业档案，以及开户的董事会决议"
        who: bank
        source: acra
