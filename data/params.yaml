  source: "frozen on dev seeds 0-299 only by eval/e6_freeze.py (results/detect_freeze.json; results/prereg.md addendum 2026-10-20 (7))"
  as_of: 2026-10-20
  note: "CUSUM allowance per week, in the owner's weekly-noise sigmas, on the drop below the adaptive reference. Replaces detect_k (0.12 on the raw ratio)."

detect_h_sd:
  value: 5
  unit: sigma
  source: "frozen on dev seeds 0-299 only by eval/e6_freeze.py (results/detect_freeze.json; results/prereg.md addendum 2026-10-20 (7))"
  as_of: 2026-10-20
  note: "CUSUM alarm threshold, in sigmas. Replaces detect_h (0.40 on the raw ratio). Dev seeds 0-299 (E6 counting, onsets weeks 4-40): 1.69 false alarms a chain-year, median delay 2 weeks at -20%, 57% within 3 weeks, 79% within 26."

detect_ref_lambda:
  value: 0.5
  unit: share
  source: "frozen on dev seeds 0-299 only by eval/e6_freeze.py (results/detect_freeze.json; results/prereg.md addendum 2026-10-20 (7))"
  as_of: 2026-10-20
  note: "EWMA weight of the adaptive reference (the log profit ratio's recent level)."

detect_ref_lag:
  value: 2
  unit: weeks
  source: "frozen on dev seeds 0-299 only by eval/e6_freeze.py (results/detect_freeze.json; results/prereg.md addendum 2026-10-20 (7))"
  as_of: 2026-10-20
  note: "The reference uses observed weeks up to this many weeks before the week checked, so a step is compared with the level before it."

detect_baseline_weeks:
  value: 13
  unit: weeks
  source: "build-team assumption; h calibrated on dev seeds before E6 (results/prereg.md)"
  as_of: 2026-10-19
  note: "Weeks before goal start used to fix the baseline level."

detect_shape_shrink:
  value: false
  unit: bool
  source: "frozen on dev seeds 0-299 only by eval/e6_freeze.py (results/detect_freeze.json; results/prereg.md addendum 2026-10-20 (7))"
  as_of: 2026-10-20
  note: "Shrink the seasonal shape toward flat by the empirical-Bayes noise weight (addendum 2026-10-19). It also pulls the persona's real Jan-Feb trough toward flat."

detect_channel_shift_tolerance:
  value: 0.05
  unit: share
  source: "build-team assumption, not tuned: half of the persona's normal 10% delivery share (results/prereg.md addendum 2026-10-20 (7))"
  as_of: 2026-10-20
  note: "A week is a channel shift only if its delivery share is above the owner's own pre-start share by more than this (and revenue holds, detect_shift_revenue_sd). Was 0.03 on the share itself, which Chen's normal 10% always exceeded."

detect_shift_revenue_sd:
  value: 2.0
  unit: sigma
  source: "build-team assumption, not tuned (results/prereg.md addendum 2026-10-20 (7))"
  as_of: 2026-10-20
  note: "Revenue holds if the week's revenue is no more than this many revenue sigmas below its expectation (revenue level x revenue seasonal shape)."

shock_persist_assume:
  value: true
  unit: bool
  source: "build-team assumption; h calibrated on dev seeds before E6 (results/prereg.md)"
  as_of: 2026-10-19
  note: "When a drop is detected, the re-plan assumes the observed level persists."
detect_persist_weight:
  value: 0.5
  unit: share
  source: "build-team assumption (part of a detected drop is ordinary month-to-month variation that reverts)"
  as_of: 2026-10-19
  note: "When a drop is detected, the re-plan assumes this share of the observed shortfall persists: level = 1 - weight x (1 - observed ratio)."
