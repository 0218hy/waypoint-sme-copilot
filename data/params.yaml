# ------------------------------------------------------------------ cost uncertainty

cost_overrun_rho:
  value: 0.5
  unit: correlation
  source: "SPEC §13 (build-team assumption; sensitivity 0.3 / 0.7)"
  as_of: 2026-10-16
  note: "Gaussian copula correlation across fit-out, equipment, setup and pre-opening-rent overruns."

bad_case_quantile:
  value: 0.90
  unit: quantile of the total
  source: "Build-team choice"
  as_of: 2026-10-16
  note: "The 'if things go badly' total is the P90 of the simulated total, not the worst case on every line."

likely_quantile:
  value: 0.50
  unit: quantile of the total
  source: "Build-team choice: the median of the simulated total"
  as_of: 2026-10-20
  note: "The 'likely' total is the P50 of the simulated total, so it is as likely to come in above as below. The sum of each input's most likely value (the 'base estimate') sits below it because the cost ranges are skewed upwards."

quote_variation_allowance:
  value: {low: 0.0, likely: 0.05, high: 0.15}
  unit: share of the accepted quote
  source: "Build-team assumption (to verify): variations and extras on an accepted quote. Singapore renovation guides advise keeping a 10-20% contingency on top of a quote (e.g. renonation.sg, 'Does your renovation need a contingency fund')"
  url: "https://www.renonation.sg/does-your-renovation-need-a-contingency-fund"
  as_of: 2026-10-20
  note: "Triangular, applied to each line an accepted quote covers in full, with the line's overrun draw; a quote fixes the price of the work it lists, not the changes made during the job."

reader_check_confidence:
  value: 0.8
  unit: reader confidence (0..1)
  source: "Build-team choice"
  as_of: 2026-10-20
  note: "A quote line read with lower confidence is marked 'check': the owner confirms it on its own; 'Accept all' leaves it."

cost_mc_samples:
  value: 4000
  unit: samples
  source: "Build-team choice"
  as_of: 2026-10-16
  note: "Samples used to find the bad-case total and each line's share of it."

cost_bad_window:
  value: 0.02
  unit: quantile half-width
  source: "Build-team choice"
  as_of: 2026-10-16
  note: "Line likely and bad values = average of each line over samples whose total lies within P50 (likely) or P90 (bad) +/- this window, so the lines add up to the total."

