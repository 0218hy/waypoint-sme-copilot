# Waypoint parameters (SPEC §13). Every number the tools use lives here, with its unit, source and date.
# Nothing in tools/, rules/ or sim/ hard-codes a fact. "Build-team assumption" means a modelling choice
# made by the team that must be verified or calibrated before production; "to verify" flags a public
# figure we could not confirm from the primary source at the as_of date.
#
# Shape of every entry:
#   key:
#     value: <number | {low, likely, high} | mapping | list>
#     unit: <unit>
#     source: <where it comes from>
#     as_of: <date>
#     note: <how it is used / caveats>

# ------------------------------------------------------------------ FX and time

fx_cny_per_sgd:
  value: 5.25
  unit: CNY per SGD
  source: "Build-team dated rate (SPEC §13); Q3 2026 average 5.27"
  as_of: 2026-10-16
  note: "All CNY figures shown with this rate and its date. Re-dated before every demo."

fx_annual_vol:
  value: 0.04
  unit: share per year
  source: "Build-team assumption (CNY/SGD 1-year realised volatility has been roughly 3-5%)"
  as_of: 2026-10-16
  note: "Monte Carlo draws one log-normal FX move per run over a one-year horizon."

weeks_per_month:
  value: 4.345
  unit: weeks per month
  source: "Calendar: 365.25 / 12 / 7"
  as_of: 2026-10-16
  note: "All monthly amounts are converted to weekly steps with this factor."

horizon_weeks:
  value: 156
  unit: weeks
  source: "SPEC §6.6"
  as_of: 2026-10-16
  note: "Plan model horizon (3 years)."

default_seed:
  value: 20261019
  unit: seed
  source: "Build-team choice"
  as_of: 2026-10-19
  note: "Default seed for every random draw; tools return the seed they used."

# ------------------------------------------------------------------ safety floor (SPEC §6.5)

floor_payroll_weeks:
  value: 8
  unit: weeks of payroll
  source: "SPEC §6.5 design rule"
  as_of: 2026-10-16
  note: "Floor = 8 weeks of payroll + the next 2 loan repayments. The owner may raise it."

floor_loan_repayments:
  value: 2
  unit: monthly repayments
  source: "SPEC §6.5 design rule"
  as_of: 2026-10-16
  note: "Next 2 scheduled WeBank repayments are kept in the floor."

buffer_payroll_weeks:
  value: 4
  unit: weeks of payroll
  source: "SPEC §6.5 design rule"
  as_of: 2026-10-16
  note: "Payroll buffer above the floor; set-asides only come from cash above floor + buffer."

floor_risk_limit:
  value: 0.05
  unit: share of runs
  source: "SPEC §8.1 R5 (design rule)"
  as_of: 2026-10-16
  note: "The slider wall: the largest set-aside share whose floor risk stays at or below this, judged on the Wilson 95% upper bound of the estimate (tools/plan.py), not the point estimate."

payroll_to_profit_ratio_default:
  value: 1.3
  unit: ratio
  source: "Build-team assumption (tea chains: payroll about 25-30% of sales, profit about 20%)"
  as_of: 2026-10-16
  note: "Only used in standalone mode when the owner gives profit but not payroll. Shown as an estimate."

# ------------------------------------------------------------------ status, alerts

alert_move_weeks:
  value: 2
  unit: weeks
  source: "SPEC §7.2"
  as_of: 2026-10-16
  note: "Alert when the likely opening moves by at least this much."

act_by_alert_days:
  value: 14
  unit: days
  source: "SPEC §7.2"
  as_of: 2026-10-16
  note: "Alert when a milestone's act-by date is within this many days."

status_thresholds:
  value:
    on_track_slip_weeks: 2
    at_risk_slip_weeks: 6
    at_risk_floor_risk: 0.05
    off_track_floor_risk: 0.10
  unit: weeks / share
  source: "SPEC §7.2 status table"
  as_of: 2026-10-20
  note: "On track: slip <= 2 wk and floor risk <= 5%. At risk: slip over 2 and up to 6 wk, or floor risk over 5% and up to 10%. Off track: beyond either, or a step past its latest-safe week. Read by app/goalkeeper.py _status_for; at_risk_floor_risk also gates alerts."

