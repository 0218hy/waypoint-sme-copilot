# ------------------------------------------------------------------ unit economics and payback (tools/unit_econ.py)

delivery_share:
  value: 0.20
  unit: share of cups sold
  source: "Build-team estimate (to verify after opening): share of a mall kiosk's cups sold through delivery apps"
  as_of: 2026-10-20
  note: "The commission on these cups is a per-cup cost. The persona's home shops' own split is in the feed (weekly in-store vs delivery revenue); a Singapore mall kiosk is assumed to sell less through apps."

delivery_commission:
  value: 0.30
  unit: share of the order value
  source: "Grab's own 2020 breakdown: GrabFood merchant commission 25-30% of the order value (Vulcan Post, Jun 2020); the top end is used. Rates vary by plan; to verify with the platform"
  url: "https://vulcanpost.com/696332/grab-responds-and-provides-actual-breakdown-of-merchant-commission"
  as_of: 2026-10-20
  note: "Charged on the menu price of delivered cups. Not GST-registered, the shop also pays GST on the commission and can't claim it back."

cup_price_range_sgd:
  value: {low: 5.00, likely: 6.00, high: 6.50}
  unit: SGD per cup (what the customer pays)
  source: "Singapore menu prices run from Mixue S$2.90 to Heytea S$6.50 (eatbook, Heytea Orchard Central); the likely value is cup_price_sgd. Build-team range for a mid-to-premium tea brand"
  url: "https://eatbook.sg/heytea-orchard-central/"
  as_of: 2026-10-20
  note: "Price sensitivity on the unit-economics card: cups needed to pay back within the lease at the low and high price. S$6.00 is at the top end of the market."

econ_cups_levels:
  value: [250, 300, 350, 400, 450]
  unit: cups a day at steady state
  source: "Build-team choice: around the break-even and the cups needed to pay back within the lease"
  as_of: 2026-10-20
  note: "Rows of the store P&L on the unit-economics card, plus the owner's own figure if they give one. The middle level is the reference for the sensitivities when the owner gives none."

ramp_curve:
  value:
    likely: {s0: 0.6, tau_months: 3}
    bad: {s0: 0.5, tau_months: 6}
  unit: s0 = first month's share of steady-state cups; tau = months
  source: "Build-team estimate (not a measured curve): a new mall kiosk starts at about half to 60% of its steady volume and closes most of the gap in 3-6 months"
  as_of: 2026-10-20
  note: "cups in month m = steady cups x (1 - (1 - s0) x exp(-(m - 1) / tau)). 'Likely' pairs the likely curve with the likely investment; 'if things go badly' pairs the slow curve with the P90 investment."

discount_rate_annual:
  value: 0.12
  unit: share per year
  source: "Build-team choice: a hurdle rate for a first overseas shop of a small chain (sensitivity 8% and 15%)"
  as_of: 2026-10-20
  note: "36-month NPV of the shop's after-tax cash flows, discounted monthly at (1 + r)^(1/12) - 1."

discount_rate_sensitivity:
  value: [0.08, 0.15]
  unit: share per year
  source: "Build-team choice"
  as_of: 2026-10-20
  note: "The NPV is also shown at these rates."

sg_cit_rate:
  value: 0.17
  unit: share of chargeable income
  source: "IRAS: corporate income tax rate 17%"
  url: "https://www.iras.gov.sg/taxes/corporate-income-tax/basics-of-corporate-income-tax/corporate-income-tax-rate-rebates-and-tax-exemption-schemes"
  as_of: 2026-10-20
  note: "Applied each year of the lease to EBITDA less the investment spread over the lease, losses carried forward. One-off CIT rebates are not modelled."

sg_partial_exemption:
  value:
    - {up_to_sgd: 10000, exempt_share: 0.75}
    - {up_to_sgd: 200000, exempt_share: 0.50}
  unit: chargeable income bands (cumulative, SGD) and the share of each band that is exempt
  source: "IRAS partial tax exemption from YA 2020: 75% of the first S$10,000, 50% of the next S$190,000. The start-up exemption (SUTE) is not used: it needs at least one individual shareholder holding at least 10% of the shares, so a subsidiary wholly owned by Chen's Shenzhen company does not qualify"
  url: "https://www.iras.gov.sg/taxes/corporate-income-tax/basics-of-corporate-income-tax/corporate-income-tax-rate-rebates-and-tax-exemption-schemes"
  as_of: 2026-10-20
  note: "Partial exemption only."

reinstatement_sgd:
  value: 20000
  unit: SGD (once, at the end of the lease)
  source: "Build-team estimate (to verify per mall): returning a small F&B unit to bare shell at the end of the lease"
  as_of: 2026-10-20
  note: "Netted off the security deposit that comes back at the end of the lease in the NPV (topic T-REINSTATEMENT)."

gst_registration_threshold_sgd:
  value: 1000000
  unit: SGD of taxable turnover a year
  source: "IRAS: GST registration is compulsory when taxable turnover exceeds S$1 million in a calendar year, or is expected to in the next 12 months"
  url: "https://www.iras.gov.sg/taxes/goods-services-tax-(gst)/basics-of-gst/registering-for-gst/do-i-need-to-register-for-gst"
  as_of: 2026-10-20
  note: "If a level's steady-state yearly sales exceed this (about 457 cups a day at S$6.00), the card treats the shop as registered: the menu price includes GST (revenue is price / 1.09) and GST on rent, supplies and commissions is claimed back."

econ_cups_search:
  value: {low: 50, high: 2000}
  unit: cups a day
  source: "Build-team choice"
  as_of: 2026-10-20
  note: "Bisection range for the cups a day needed to pay back within the lease; above the high end the card says 'not within this range'."

chain_benchmarks:
  value:
    - {id: nayuki_payback_2018, value: 10.6, unit: months, en: "Nayuki: payback of its stores opened in 2018", zh: "奈雪的茶：2018年开业门店的投资回收期", url: "https://www1.hkexnews.hk/listedco/listconews/sehk/2021/0618/2021061800009.pdf", page: 197}
    - {id: nayuki_payback_2018_19, value: 15.5, unit: months, en: "Nayuki: payback of its stores opened in 2018-19", zh: "奈雪的茶：2018-19年开业门店的投资回收期", url: "https://www1.hkexnews.hk/listedco/listconews/sehk/2021/0618/2021061800009.pdf", page: 197}
    - {id: nayuki_store_margin_2020, value: 0.122, unit: pct, en: "Nayuki: store operating margin, 2020 (18.9% in 2018)", zh: "奈雪的茶：2020年门店经营利润率（2018年为18.9%）", url: "https://www1.hkexnews.hk/listedco/listconews/sehk/2021/0618/2021061800009.pdf", page: 197}
    - {id: guming_franchisee_margin_2023, value: 0.202, unit: pct, en: "Guming: franchisee store operating margin, FY2023", zh: "古茗：2023财年加盟店经营利润率", url: "https://www1.hkexnews.hk/listedco/listconews/sehk/2025/0204/2025020400011.pdf", page: 179}
    - {id: mixue_cups_per_store, value: 640, unit: cups_per_day, en: "Mixue: cups a store a day", zh: "蜜雪冰城：单店日均杯量", url: "https://www1.hkexnews.hk/listedco/listconews/sehk/2025/0221/2025022100009.pdf", page: 15}
  unit: as given per row
  source: "HKEX listing prospectuses of Nayuki (2021), Guming (2025) and Mixue (2025), pages as given; read for the judge-response memo (docs/research/judge-response.md §3a)"
  as_of: 2026-10-20
  note: "Benchmarks shown in the unit-economics card's footer, for context only: Chinese home-market stores, not a forecast for a Singapore kiosk. The 2018 store margin (18.9%) is quoted in the label, not as a figure."

